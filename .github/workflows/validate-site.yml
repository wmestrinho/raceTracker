name: Validate Site

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate canonical structure
        run: python3 scripts/validate_structure.py

      - name: Validate JavaScript syntax
        run: node --check raceTracker/assets/js/main.js

      - name: Validate telemetry JSON
        run: python3 -m json.tool raceTracker/assets/data/telemetry.json > /dev/null
