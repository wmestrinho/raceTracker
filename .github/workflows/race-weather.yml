name: Race Weather Pipeline

# Refreshes raceTracker/assets/data/race-weather.json every morning and pushes a
# webhook alert when rain or a severe track-temperature drop lands inside the
# 7-day window of a race weekend.
#
# Required repository secret (optional — the run still refreshes the feed without it):
#   RACETRACKER_WEATHER_WEBHOOK_URL   Slack or Discord incoming webhook URL
#
# No forecast API key is needed: the pipeline defaults to Open-Meteo, which is
# public and credential-free, matching the repo's live-data guardrail.

on:
  schedule:
    # 11:00 UTC — early morning across US race-team time zones.
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      force_notify:
        description: 'Send the webhook even if the alert set has not changed'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: race-weather
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate calendar / track join
        run: python3 scripts/build_weather_forecast.py --check

      - name: Run pipeline tests
        run: python3 scripts/test_weather_pipeline.py

      - name: Build forecast feed and send alerts
        env:
          RACETRACKER_WEATHER_WEBHOOK_URL: ${{ secrets.RACETRACKER_WEATHER_WEBHOOK_URL }}
        run: |
          python3 scripts/build_weather_forecast.py \
            --notify \
            ${{ inputs.force_notify && '--force-notify' || '' }}

      - name: Commit refreshed feed
        run: |
          if [ -z "$(git status --porcelain raceTracker/assets/data/race-weather.json)" ]; then
            echo "No forecast change; nothing to commit."
            exit 0
          fi
          git config user.name  "raceTracker weather bot"
          git config user.email "actions@users.noreply.github.com"
          git add raceTracker/assets/data/race-weather.json
          git commit -m "chore: refresh race-weekend weather feed"
          git push
